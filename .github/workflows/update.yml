name: Update profile

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - build.py
      - profile.toml
      - .github/workflows/update.yml

permissions:
  contents: write

concurrency:
  group: update-profile

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build README, cards and profile.json
        run: python3 -I build.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit changes
        run: |
          git add README.md profile.json assets
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update profile data"
          git pull --rebase
          git push
